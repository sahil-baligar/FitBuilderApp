# Railway — API service (create this service from the monorepo root).
# Dashboard: New Project → Empty → Add service from GitHub repo.
# Set Root Directory to repo root (or the `app` folder if that is the git root).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required env vars (set in Railway Variables — never commit secrets):
#   OPENAI_API_KEY       ChatGPT for stylist + garment analysis
#   FAL_KEY              ghost mannequin / try-on / style frames / cloud cutout
#   DATABASE_URL         from Railway Postgres plugin (auto-injected when linked)
#   CORS_ORIGINS         https://your-frontend.up.railway.app
# Optional:
#   OPENAI_TEXT_MODEL=gpt-4.1-mini
#   OPENAI_VISION_MODEL=gpt-4.1-mini
#   WEATHER_API_KEY
#   DATA_DIR=/data
#   JOB_CONCURRENCY=2
